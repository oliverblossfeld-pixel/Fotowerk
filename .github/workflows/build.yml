name: Bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: App bauen
        run: ./Quellcode/build.sh
      - name: App verpacken
        run: ditto -c -k --keepParent Fotowerk.app Fotowerk.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Fotowerk
          path: Fotowerk.zip
